name: Verify Gear Guru Guide Production
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: test -f dist/index.html
      - run: node -e "const p=require('./dist/assets/ggg-products.json'); if(p.length!==795) process.exit(1); console.log('Verified',p.length,'products')"
