name: Verify Gear Guru Guide Production
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: test -f dist/index.html
      - run: node -e "const p=require('./dist/assets/ggg-products.json'); if(!Array.isArray(p)||p.length<1) process.exit(1); console.log('Verified',p.length,'products')"
      - run: node -e "const p=require('./dist/assets/ggg-products.json'); const bad=p.filter(x=>Object.values(x).some(v=>typeof v==='string' && /amazon\\.com\\/s(?:\\?|\\/)/i.test(v))); if(bad.length){console.error('Amazon search URLs remain',bad.map(x=>x.id));process.exit(1)} console.log('No Amazon search-result product URLs')"
