name: Cloudflare production preflight

on:
  push:
    branches:
      - cloudflare-production-prep
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build frontend
        run: npx vite build

      - name: Validate Cloudflare bundle
        run: npx wrangler deploy --dry-run
