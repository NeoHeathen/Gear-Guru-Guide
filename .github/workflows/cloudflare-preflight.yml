name: Cloudflare production preflight

on:
  push:
    branches:
      - cloudflare-production-prep
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript
        run: npm run check 2>&1 | tee typescript.log

      - name: Tests
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm test 2>&1 | tee tests.log

      - name: Build frontend
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npx vite build 2>&1 | tee build.log

      - name: Validate Cloudflare bundle
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npx wrangler deploy --dry-run 2>&1 | tee wrangler.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-preflight-logs
          path: |
            typescript.log
            tests.log
            build.log
            wrangler.log
