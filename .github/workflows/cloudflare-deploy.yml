name: Deploy Gear Guru Guide to Cloudflare

on:
  push:
    branches:
      - cloudflare-production-prep
  workflow_dispatch:

concurrency:
  group: ggg-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_DASHBOARD_PASSWORD: ci-verification-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Verify Cloudflare credentials exist
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Install dependencies
        run: npm install

      - name: TypeScript
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build frontend
        run: npx vite build

      - name: Deploy Worker and assets
        run: npx wrangler deploy
